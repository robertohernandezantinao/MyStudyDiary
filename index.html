<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Diario de Estudio</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="contenedor">
    <header class="cabecera">
      <h1>Diario de Estudio</h1>
      <p class="subtitulo">Registra tus sesiones y no rompas la racha.</p>
    </header>

    <!-- Racha actual y mejor racha -->
    <section class="racha" aria-live="polite">
      <div class="racha-bloque">
        <p class="racha-etiqueta">Racha actual</p>
        <p class="racha-numero">🔥 <span id="racha">0</span></p>
        <p class="racha-texto" id="racha-texto">días</p>
      </div>

      <div class="racha-bloque racha-bloque--mejor">
        <p class="racha-etiqueta">Mejor racha</p>
        <p class="racha-numero">🏆 <span id="mejor-racha">0</span></p>
        <p class="racha-texto" id="mejor-racha-texto">días</p>
      </div>
    </section>

    <!-- Resumen: minutos de la semana y días del mes -->
    <section class="tarjeta resumen">
      <div class="resumen-fila">
        <span class="resumen-etiqueta">Esta semana</span>
        <span class="resumen-valor" id="minutos-semana">0 min</span>
      </div>
      <div class="resumen-fila">
        <span class="resumen-etiqueta">Este mes</span>
        <span class="resumen-valor" id="dias-mes">0 días</span>
      </div>
    </section>

    <!-- Formulario para añadir una sesión -->
    <section class="tarjeta">
      <h2>Nueva sesión</h2>
      <form id="formulario">
        <div class="campo">
          <label for="fecha">Fecha</label>
          <input type="date" id="fecha" required>
        </div>

        <div class="campo">
          <label for="tema">Tema</label>
          <input type="text" id="tema" placeholder="Ej: JavaScript" required>
        </div>

        <div class="campo">
          <label for="minutos">Minutos</label>
          <input type="number" id="minutos" min="1" step="1" placeholder="Ej: 30" required>
        </div>

        <button type="submit">Guardar sesión</button>
      </form>
    </section>

    <!-- Lista de sesiones -->
    <section class="tarjeta">
      <h2>Mis sesiones</h2>
      <ul id="lista" class="lista"></ul>
      <p id="mensaje-vacio" class="mensaje-vacio">
        Todavía no hay sesiones. ¡Empieza hoy!
      </p>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
